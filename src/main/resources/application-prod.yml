server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/forja_db?useSSL=true&requireSSL=true
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET_KEY}
