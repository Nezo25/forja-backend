version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: forja_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: forja_db_root_pass_2026!
      MYSQL_DATABASE: forja_db
      MYSQL_USER: forja_app
      MYSQL_PASSWORD: forja_app_secure_pass_2026!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - forja_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "forja_app", "-pforja_app_secure_pass_2026!"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forja_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/forja_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
      DB_USER: forja_app
      DB_PASSWORD: forja_app_secure_pass_2026!
      JWT_SECRET_KEY: forja_do_chico_ultra_secure_jwt_token_2026_super_key_512_bytes_random_secret
      PORT: 8080
    expose:
      - "8080"
    networks:
      - forja_net

  caddy:
    image: caddy:alpine
    container_name: forja_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - forja_net

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  forja_net:
    driver: bridge
